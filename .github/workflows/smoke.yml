name: TigerChain security smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  isolated-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: python -m pip install pytest 'pydantic-settings>=2.4,<3' sqlmodel==0.0.21 python-jose==3.3.0 'passlib[bcrypt]==1.7.4' bcrypt==4.0.1 fastapi==0.112.2 'email-validator>=2,<3' python-multipart==0.0.9
      - name: Compile all Python source
        run: python -m compileall -q worker
      - name: Run dependency-free upload boundary tests
        run: cd worker && python -m pytest -q tests/test_upload_validation.py tests/test_p0_security.py

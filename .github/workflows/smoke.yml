name: TigerChain isolated unit checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  isolated-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: python -m pip install pytest 'pydantic-settings>=2.4,<3' sqlmodel==0.0.21 python-jose==3.3.0 'passlib[bcrypt]==1.7.4' bcrypt==4.0.1 fastapi==0.112.2 'email-validator>=2,<3' python-multipart==0.0.9
      - name: Install mocked RAG test dependencies
        run: python -m pip install 'langchain==0.2.16' 'langchain-community==0.2.16' 'langchain-text-splitters==0.2.2' 'pyTigerGraph>=1.5,<2' 'langchain-openai>=0.1.20,<0.2' 'httpx>=0.27,<0.28'
      - name: Compile all Python source
        run: python -m compileall -q worker
      - name: Run isolated unit and security regression tests
        run: cd worker && python -m pytest -q tests/

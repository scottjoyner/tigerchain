name: TigerChain security smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  isolated-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: python -m pip install pytest
      - name: Compile all Python source
        run: python -m compileall -q worker
      - name: Run dependency-free upload boundary tests
        run: cd worker && python -m pytest -q tests/test_upload_validation.py
